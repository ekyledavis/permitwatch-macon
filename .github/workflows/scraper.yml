name: Weekly Permit Scraper

on:
  schedule:
    # Every Monday at 8:00 AM UTC (adjust if you want a different local time)
    - cron: '0 8 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run scraper
        run: python scraper/mbpz_scraper.py --months 12 --out public/permitwatch_data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/permitwatch_data.json scraper/geocode_cache.json
          git diff --quiet --cached || git commit -m "Weekly permit data update"
          git push
