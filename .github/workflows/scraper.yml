name: Weekly Permit Scraper

on:
  schedule:
    # Every Monday at 8:00 AM UTC (adjust if you want a different local time)
    - cron: '0 8 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

concurrency:
  group: weekly-permit-scraper
  cancel-in-progress: false   # queue a second trigger rather than run alongside the first

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber psycopg2-binary

      - name: Run scraper
        run: python scraper/mbpz_scraper.py --months 12 --out public/permitwatch_data.json

      - name: Send alert emails to subscribers
        continue-on-error: true  # never let an alerting bug block the data commit below
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scraper/send_alerts.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f scraper/alert_state.json ] || echo '{}' > scraper/alert_state.json
          git add public/permitwatch_data.json scraper/geocode_cache.json scraper/alert_state.json
          git diff --quiet --cached || git commit -m "Weekly permit data update"

          # This job can take 10+ minutes (PDF parsing, one-off geocode
          # migrations), so main may have moved during the run - e.g. someone
          # merged a PR while this was still scraping. Rebase onto the latest
          # main right before pushing, retrying a few times in case another
          # push lands in that same short window.
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" = "3" ]; then
              echo "::error::Push still failing after $attempt attempts, giving up."
              exit 1
            fi
          done
